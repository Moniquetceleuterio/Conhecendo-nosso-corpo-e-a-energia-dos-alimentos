<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <style>
    :root { 
      --brand: #003366;
      --bg-light: #f5f7fb;
      --text: #333;
    }

    body {
      font-family: Arial, sans-serif;
      background: var(--bg-light);
      color: var(--text);
      margin: 40px;
      line-height: 1.65;
    }

    img {
      display:block;
      margin:0 auto 30px;
      border-radius: 10px;
      max-width: 100%;
    }

    h2 {
      text-align:center;
      color:var(--brand);
      margin:40px auto 24px;
      font-size: 1.6rem;
    }

    /* Flipbook responsivo */
    .flipbook-wrapper {
      max-width: 900px;
      margin: 0 auto 40px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 12px rgba(0,0,0,0.12);
    }

    iframe {
      width: 100%;
      height: 650px;
      border: none;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <!-- BANNER -->
  <img src="banner2.png" alt="Banner da aula">

  <!-- FLIPBOOK -->
  <h2>E-book completo</h2>

  <div class="flipbook-wrapper">
    <iframe 
      allowfullscreen="allowfullscreen"
      allow="clipboard-write"
      scrolling="no"
      src="https://heyzine.com/flip-book/e123771916.html">
    </iframe>
  </div>

</body>
</html>
