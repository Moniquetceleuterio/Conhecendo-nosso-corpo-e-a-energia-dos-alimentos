<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

    :root { 
      --brand: #003366;
      --brand-light: #e0e6f5;
      --bg-light: #f5f7fb;
      --text: #333;
    }

    body {
      font-family: Arial, sans-serif;
      background: var(--bg-light);
      color: var(--text);
      margin: 40px;
      line-height: 1.65;
    }

    img {
      display:block;
      margin:0 auto 30px;
      border-radius: 10px;
      max-width: 100%;
    }

    h1 {
      text-align: center;
      color: var(--brand);
      font-size: 2rem;
      margin-top: 5px;
    }

    h2 {
      color: var(--brand);
      text-align:center;
      margin:40px auto 24px;
      max-width: 900px;
    }

    h3, h4, h5 {
      color: var(--brand);
      max-width: 900px;
      margin:30px auto 10px;
    }

    p {
      max-width: 900px;
      margin: 10px auto;
      text-align: justify;
    }

    ul {
      max-width: 900px;
      margin: 20px auto;
      text-align: justify;
      line-height: 1.6;
    }

      position: relative;
    }

    .livro-pagina { display: none; }

      margin-top: 14px;
      margin-bottom: 4px;
      font-size: 1rem;
    }
